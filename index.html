  <h2>✨ What This App Does</h2>
  <p>Most video tools ask you to edit clips, adjust timing, and stitch everything together by hand. This application works from a different angle. You type a topic, and the app walks through the entire production process for you.</p>
  <p>It starts by writing a short script built around a curiosity loop, so viewers stay hooked from the first second to the last. It then creates consistent character sheets, generates 3D keyframes, animates them with Veo 3.1 motion, adds a voiceover, burns in captions, and finishes with sharp, punchy edits using ffmpeg.</p>
  <p>The result is a complete animated short in the recognizable Zack D Films style: bold visuals, fast pacing, a clear narrative hook, and clean audio.</p>

  <h2>🚀 Key Features</h2>
  <div class="card">
    <ul>
      <li><strong>Curiosity-loop scripting.</strong> The app writes a short script that opens with a question or a surprise, then pays it off at the end. This structure keeps viewers watching and encourages rewatches.</li>
      <li><strong>Character sheets for consistency.</strong> The same character looks the same in every shot. The app generates reference sheets first, then reuses them across all keyframes.</li>
      <li><strong>3D keyframes.</strong> Each scene gets rendered keyframes with depth, lighting, and a consistent visual identity.</li>
      <li><strong>Veo 3.1 motion.</strong> Keyframes are turned into moving footage with smooth, believable animation.</li>
      <li><strong>Voiceover generation.</strong> Narration is produced automatically, with voice cloning support so you can keep a recognizable narrator across videos.</li>
      <li><strong>Automatic captions.</strong> On-screen text is synced to the narration, making the video readable with the sound off.</li>
      <li><strong>Punchy edits with ffmpeg.</strong> Cuts, pacing, transitions, and final encoding are handled in one automated pass.</li>
      <li><strong>Built as an agent skill.</strong> The project works as a skill for Claude Code, Codex, and other coding agents, so it fits into automated workflows.</li>
      <li><strong>Powered by MuAPI.</strong> All heavy generation runs through MuAPI, so your own computer does not need a powerful graphics card.</li>
    </ul>
  </div>

  <h2>🛠️ How a Video Gets Made</h2>
  <p>The application runs a fixed sequence of stages. Understanding them helps you know what to expect and where to make changes.</p>
  <ol>
    <li><strong>Topic intake.</strong> You provide a subject, a question, or a short brief. The more specific the topic, the stronger the result.</li>
    <li><strong>Script writing.</strong> A short narration is drafted with a curiosity loop: a hook, a build-up, and a satisfying payoff.</li>
    <li><strong>Character design.</strong> Character sheets are created so faces, outfits, and proportions stay identical across scenes.</li>
    <li><strong>Keyframe generation.</strong> Each shot is rendered as a 3D keyframe that matches the script beat.</li>
    <li><strong>Motion generation.</strong> Veo 3.1 animates the keyframes into moving clips.</li>
    <li><strong>Voiceover.</strong> Narration is generated and timed to the visuals.</li>
    <li><strong>Captions and editing.</strong> Captions are synced, cuts are tightened, and the final file is encoded with ffmpeg.</li>
  </ol>
  <p>Because the stages run in order, a small fix early on, such as a clearer topic or a tighter script, often improves everything that follows.</p>

  <h2>💡 Tips for Better Results</h2>
  <ul>
    <li><strong>Be specific with your topic.</strong> "Why do octopuses have three hearts" produces a sharper video than "octopus facts".</li>
    <li><strong>Keep it short.</strong> Shorts work best when the idea fits into a single, clean explanation.</li>
    <li><strong>Use a consistent narrator.</strong> If you plan a series, reuse the same cloned voice so viewers recognize your channel instantly.</li>
    <li><strong>Review the script before generating visuals.</strong> Script tweaks are cheap; regenerating footage is not.</li>
    <li><strong>Check captions.</strong> Technical or medical terms occasionally need a manual correction.</li>
    <li><strong>Keep projects organized.</strong> One folder per topic makes finished files and source assets easy to find later.</li>
  </ul>

  <h2>🔧 Troubleshooting</h2>
  <h3>The download page does not open</h3>
  <p>Make sure you are using the exact link above. If a browser blocks the page, try a different browser or disable any extension that interferes with page loading.</p>
  <h3>Generation stops partway through</h3>
  <p>This is almost always a connection issue. Check your internet connection, then run the project again. Most stages resume from where they stopped rather than starting over.</p>
  <h3>An error mentions your API key</h3>
  <p>Confirm the key was copied completely, with no extra spaces. If the key was regenerated recently, replace the old one in the application settings.</p>
  <h3>Characters look slightly different between shots</h3>
  <p>Character sheets are the anchor for consistency. Keep them attached to the project and avoid editing them mid-run.</p>
  <h3>The final video will not play</h3>
  <p>Try a different media player. Some players struggle with certain encoded formats even when the file itself is fine.</p>
